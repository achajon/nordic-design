<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>promo-independencia-corte-masaje</title>
<style>
  @font-face{
    font-family:"Lost in South";
    src:url("assets/fonts/Lost in South.otf") format("opentype");
  }
  @font-face{
    font-family:"Fira Sans Condensed";
    src:url("assets/fonts/FiraSansCondensed-Regular.ttf") format("truetype");
    font-weight:400;
  }
  @font-face{
    font-family:"Fira Sans Condensed";
    src:url("assets/fonts/FiraSansCondensed-Bold.ttf") format("truetype");
    font-weight:700;
  }
  @font-face{
    font-family:"Fira Sans Condensed";
    src:url("assets/fonts/FiraSansCondensed-ExtraBold.ttf") format("truetype");
    font-weight:800;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1350px;background:#101010;overflow:hidden;}
  .canvas{
    position:relative;
    width:1080px;
    height:1350px;
    background:#101010;
  }
  .bg-wrap{
    position:absolute;
    inset:0;
    overflow:hidden;
  }
  .bg{
    position:absolute;
    top:-60px;
    left:0;
    width:1080px;
    height:auto;
  }
  .scrim{
    position:absolute;
    left:0; right:0; bottom:0;
    height:60%;
    background:linear-gradient(to bottom, rgba(16,16,16,0) 0%, rgba(16,16,16,.55) 40%, rgba(16,16,16,.92) 75%, rgba(16,16,16,1) 100%);
  }
  .top-scrim{
    position:absolute;
    left:0; right:0; top:0;
    height:32%;
    background:linear-gradient(to bottom, rgba(16,16,16,.55) 0%, rgba(16,16,16,0) 100%);
  }
  .pill{
    position:absolute;
    top:64px; left:64px;
    background:#FFD200;
    color:#101010;
    font-family:"Fira Sans Condensed";
    font-weight:800;
    font-size:26px;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:14px 32px;
    border-radius:40px;
  }
  .headline{
    position:absolute;
    left:64px; right:64px;
    bottom:352px;
    font-family:"Lost in South";
    font-size:80px;
    letter-spacing:.06em;
    line-height:1.0;
    text-transform:uppercase;
    color:#F7F4EC;
  }
  .headline .hl{
    color:#FFD200;
    font-family:"Fira Sans Condensed";
    font-weight:800;
    letter-spacing:.02em;
  }
  .caption{
    position:absolute;
    left:64px; right:64px;
    bottom:232px;
    font-family:"Fira Sans Condensed";
    font-weight:400;
    font-size:30px;
    line-height:1.4;
    color:#F7F4EC;
    opacity:.85;
  }
  .rules{
    position:absolute;
    left:64px; right:64px;
    bottom:56px;
    display:flex;
    align-items:baseline;
    gap:10px;
    font-family:"Fira Sans Condensed";
    font-weight:700;
    font-size:24px;
    color:#F7F4EC;
    text-transform:uppercase;
    letter-spacing:.02em;
  }
  .rules .tag{
    color:#FFD200;
    font-weight:800;
  }
  .logo{
    position:absolute;
    right:64px;
    top:60px;
    height:64px;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="bg-wrap"><img class="bg" src="assets/bg.png"></div>
    <div class="top-scrim"></div>
    <div class="scrim"></div>
    <div class="pill">Mes de la patria</div>
    <img class="logo" src="assets/Nordic-BarberShop-logo-white.svg">
    <div class="headline">Corte + masaje<br>por <span class="hl">Q100</span></div>
    <div class="caption">Tu corte de cabello más 15 minutos de masaje en nuestra área de masajes.</div>
    <div class="rules">
      <span class="tag">Válido</span> del 1 al 30 de septiembre
    </div>
  </div>
</body>
</html>
